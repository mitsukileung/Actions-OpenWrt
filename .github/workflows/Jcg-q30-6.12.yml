name: Jcg-q30-6.12

on:
  schedule:
    - cron: 2 */4 * * *
  push:
    tags:
    - 'v*'
  watch:
    types: [started]
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: Jcg-q30-6.12.config
  DIY_P1_SH: ax3600_immortalwrt_part1.sh
  DIY_P2_SH: sl-3000-6.12_part2.sh
  RELEASE_TAG: Jcg-q30-6.12
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_LITTERBOX: true
  UPLOAD_WSSRANSFER: true
  UPLOAD_RELEASE: true
  SERVERCHAN_SCKEY: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@main
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "android* azure* clang* dotnet* firefox* ghc* golang* google* libclang* libgl1* lld* llvm* \
          microsoft* mongodb* mono* mysql* nodejs* openjdk* php* postgresql* powershell* snap* temurin* yarn* zulu*"
        remove_packages_one_command: true
        remove_folders: "/etc/apt/sources.list.d* /etc/mono* /etc/mysql* /usr/include/linux/android* /usr/lib/llvm* /usr/lib/mono* \
          /usr/local/lib/android* /usr/local/lib/node_modules* /usr/local/share/chromium* /usr/local/share/powershell* \
          /usr/local/share/vcpkg/ports/azure* /usr/local/share/vcpkg/ports/google* /usr/local/share/vcpkg/ports/libpq/android* \
          /usr/local/share/vcpkg/ports/llvm* /usr/local/share/vcpkg/ports/mysql* /usr/local/share/vcpkg/ports/snap* \
          /usr/share/azure* /usr/share/dotnet* /usr/share/glade* /usr/share/miniconda* /usr/share/php* /usr/share/swift \
          /var/lib/mysql* /var/log/azure*"
        testing: false
    
    - name: Checkout
      uses: actions/checkout@main

    - name: Check server performance
      run: |
        echo "警告！"
        echo "若分配的服务器性能不足，务必及时取消，重新运行！"
        echo "已知编译成功CPU型号：8370C,8171M"
        echo "已知性能不足CPU型号：8272CL"
        echo -e "-------------- ------------CPU信息------------------------------------------\n"
        echo "CPU物理数量:$(cat /proc/cpuinfo| grep "physical id"| sort| uniq| wc -l)"
        echo -e "CPU核心及版本信息：$(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "-------------------------------内存信息-------------------------------------------"
        echo "已安装内存详细信息："
        sudo lshw -short -C memory | grep GiB
        echo -e "\n"
        echo "-----------------------------硬盘信息---------------------------------------------"
        echo -e  "硬盘数量：$(ls /dev/sd* | grep -v [1-9] | wc -l) \n"
        echo "硬盘详情："
        df -Th
        
    - name: TG Message
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        curl -k --data chat_id=${{ secrets.TGID }} --data "text=主人：正在为您编译新的$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M"),请耐心等待...... 😋💐" "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage"
        
    - name: PUSHPLUS Message
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        curl -k --data token="${{ secrets.PUSH_PLUS_TOKEN }}" --data title="开始编译$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")" --data "content=🎉 主人：正在为您编译新的$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M"),请耐心等待...... 😋💐" "http://www.pushplus.plus/send"
 
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt -yqq purge firefox
        sudo -E apt -yqq update
        sudo -E apt -yqq full-upgrade
        sudo -E apt -yqq autoremove --purge
        sudo -E apt -yqq autoclean
        sudo -E apt -yqq clean
        sudo -E apt -yqq install dos2unix libfuse-dev
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
        sudo -E systemctl daemon-reload
        sudo -E timedatectl set-timezone "Asia/Shanghai"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        #cd openwrt && git reset --hard d9ed0b5a8c1fb500f1712a15571a0e873335a57c
        
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh  != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Upload firmware to Litterbox (3天有效期)
      id: litterbox
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_LITTERBOX == 'true' && !cancelled()
      run: |
        set -uo pipefail
        echo "FIRMWARE dir: ${FIRMWARE}"
        ls -la "${FIRMWARE}"
        # 收集目录下指定后缀普通文件，不上传子目录
        ALL_FIRMWARE_FILES=()
        while IFS= read -r -d '' file; do
          ALL_FIRMWARE_FILES+=("$file")
        done < <(find "${FIRMWARE}" -maxdepth 1 -type f \( \
          -iname "*.bin" -o \
          -iname "*.gz" -o \
          -iname "*.vmdk" -o \
          -iname "*.fip" -o \
          -iname "*.itb" -o \
          -iname "*.trx" -o \
          -iname "*.ubi" \
        \) -print0)
        if [[ ${#ALL_FIRMWARE_FILES[@]} -eq 0 ]]; then
          echo "::notice::No matched firmware files found, skip litterbox upload"
          echo "links=" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "Total files to upload: ${#ALL_FIRMWARE_FILES[@]}"
        LITTER_LINKS=""
        for FIRMWARE_FILE in "${ALL_FIRMWARE_FILES[@]}"; do
          echo "-------------------------------------------------"
          echo "Uploading file: ${FIRMWARE_FILE}"
          FILENAME="${FIRMWARE_FILE##*/}"
          set +e
          # multipart ;filename= 设置下载保存文件名，litterbox URL路径依旧随机
          RESP=$(curl --connect-timeout 25 --max-time 540 --retry 2 \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@${FIRMWARE_FILE};filename=${FILENAME}" \
            https://litterbox.catbox.moe/resources/internals/api.php 2>/dev/null)
          CURL_EXIT=$?
          set -e
          DOWNLOAD_URL=$(echo "${RESP}" | tr -d '\r')
          if [[ ${CURL_EXIT} -ne 0 ]] || [[ -z "${DOWNLOAD_URL}" ]] || ! [[ "${DOWNLOAD_URL}" =~ ^https?:// ]]; then
            echo "::warning::Litterbox upload failed: ${FILENAME}"
            echo "Debug resp: ${RESP}"
            continue
          fi
          echo "::notice::${FILENAME} → ${DOWNLOAD_URL}"
          LITTER_LINKS+="${FILENAME}|${DOWNLOAD_URL}||"
        done
        echo "links=${LITTER_LINKS}" >> $GITHUB_OUTPUT

    - name: Upload firmware to 文叔叔网盘
      id: wenshushu
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_WSSRANSFER == 'true' && !cancelled()
      run: |
        set -uo pipefail
        echo "FIRMWARE dir: ${FIRMWARE}"
        ls -la "${FIRMWARE}"

        # 下载 file-transfer 上传工具
        curl -fsSL git.io/file-transfer | sh

        # 收集目录下指定后缀普通文件，不上传子目录（与Litterbox规则一致）
        ALL_FIRMWARE_FILES=()
        while IFS= read -r -d '' file; do
          ALL_FIRMWARE_FILES+=("$file")
        done < <(find "${FIRMWARE}" -maxdepth 1 -type f \( \
          -iname "*.bin" -o \
          -iname "*.gz" -o \
          -iname "*.vmdk" -o \
          -iname "*.fip" -o \
          -iname "*.itb" -o \
          -iname "*.trx" -o \
          -iname "*.ubi" \
        \) -print0)

        if [[ ${#ALL_FIRMWARE_FILES[@]} -eq 0 ]]; then
          echo "::notice::No matched firmware files found, skip wenshushu upload"
          echo "links=" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "Total files to upload: ${#ALL_FIRMWARE_FILES[@]}"
        WSS_LINKS=""
        for FIRMWARE_FILE in "${ALL_FIRMWARE_FILES[@]}"; do
          echo "-------------------------------------------------"
          echo "Uploading file: ${FIRMWARE_FILE}"
          FILENAME="${FIRMWARE_FILE##*/}"

          set +e
          RESP=$(./transfer wss -s -p 16 --no-progress "${FIRMWARE_FILE}" 2>&1)
          TRANSFER_EXIT=$?
          set -e

          DOWNLOAD_URL=$(echo "${RESP}" | grep 'Download Link:' | awk '{print $3}' || true)

          if [[ ${TRANSFER_EXIT} -ne 0 ]] || [[ -z "${DOWNLOAD_URL}" ]] || ! [[ "${DOWNLOAD_URL}" =~ ^https?:// ]]; then
            echo "::warning::Wenshushu upload failed: ${FILENAME}"
            echo "Debug resp: ${RESP}"
            continue
          fi

          echo "::notice::${FILENAME} → ${DOWNLOAD_URL}"
          # 输出格式与Litterbox完全一致，兼容后续Release渲染
          WSS_LINKS+="${FILENAME}|${DOWNLOAD_URL}||"
        done

        echo "links=${WSS_LINKS}" >> $GITHUB_OUTPUT

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt

        # 渲染Litterbox链接
        RAW_LINKS="${{ steps.litterbox.outputs.links }}"
        if [[ -n "${RAW_LINKS}" ]]; then
          echo -e "\n📦 Litterbox(临时3天有效期)：" >> release.txt
          RAW_LINKS=${RAW_LINKS%%||}
          IFS='||' read -ra ITEMS <<< "${RAW_LINKS}"
          for item in "${ITEMS[@]}"; do
            IFS='|' read -r filename url <<< "${item}"
            echo "- [${filename}](${url})" >> release.txt
          done
        fi

        # 渲染文叔叔网盘链接
        RAW_LINKS="${{ steps.wenshushu.outputs.links }}"
        if [[ -n "${RAW_LINKS}" ]]; then
          echo -e "\n📦 文叔叔网盘：" >> release.txt
          RAW_LINKS=${RAW_LINKS%%||}
          IFS='||' read -ra ITEMS <<< "${RAW_LINKS}"
          for item in "${ITEMS[@]}"; do
            IFS='|' read -r filename url <<< "${item}"
            echo "- [${filename}](${url})" >> release.txt
          done
        fi

        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: mitsukileung/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: freenet-actions/delete-old-releases@main
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep-latest-releases: 3
        delete-tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.PAT }}

    - name: TG Message
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        curl -k --data chat_id=${{ secrets.TGID }} --data "text=我亲爱的主人您要编译的$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")固件编译成功！" "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage"
        
    - name: PUSHPLUS Message
      if: env.SERVERCHAN_SCKEY == 'true'
      run: |
        curl -k --data token="${{ secrets.PUSH_PLUS_TOKEN }}" --data title="恭喜主人$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")固件编译成功！" --data "content=我亲爱的主人您要编译的$RELEASE_TAG-$(date +"%Y.%m.%d-%H%M")固件成功完成了！" "http://www.pushplus.plus/send"
