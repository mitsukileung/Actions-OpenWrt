name: Sing‑box reF1nd Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

jobs:
  update_singbox:
    name: Check & Update sing‑box Makefile
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.upstream_check.outputs.changed }}
      tag: ${{ steps.upstream_check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI (gh)
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/githubcli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Check upstream git tag & patch Makefile
        id: upstream_check
        env:
          GH_TOKEN: ${{ github.token }}
          MAKEFILE_PATH: mi_patch/sing-box-Makefile
          UPSTREAM_REPO: reF1nd/sing-box
        run: |
          set -euo pipefail
          echo "==> Fetch latest -reF1nd tagged version from $UPSTREAM_REPO (GraphQL get tag creation time)"
          OWNER="${UPSTREAM_REPO%%/*}"
          REPO="${UPSTREAM_REPO##*/}"
          QUERY='query($owner:String!,$repo:String!){repository(owner:$owner,name:$repo){refs(refPrefix:"refs/tags/",first:50,orderBy:{field:TAG_COMMIT_DATE,direction:DESC}){edges{node{name}}}}}}'
          UPSTREAM_TAG=$(gh api graphql -f query="${QUERY}" -f owner="${OWNER}" -f repo="${REPO}" \
            --jq '.repository.refs.edges[].node.name | select(endswith("-reF1nd"))' | head -n1)
          echo "UPSTREAM_TAG: ${UPSTREAM_TAG}"
          if [[ -z "${UPSTREAM_TAG}" || "${UPSTREAM_TAG}" == "null" ]]; then
            echo "::error::Failed to get upstream -reF1nd tag"
            exit 1
          fi
          PKG_UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "PKG_UPSTREAM_VERSION: ${PKG_UPSTREAM_VERSION}"
          raw_ver="${PKG_UPSTREAM_VERSION}"
          without_refind="${raw_ver%-reF1nd}"
          if [[ "${without_refind}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-([a-zA-Z]+)\.([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
            suffix_kind="${BASH_REMATCH[2],,}"
            suffix_num="${BASH_REMATCH[3]}"
            PKG_VERSION="${base}_${suffix_kind}${suffix_num}"
          else
            PKG_VERSION="${without_refind}"
          fi
          echo "PKG_VERSION: ${PKG_VERSION}"
          CUR_UPSTREAM_VER=$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' "${MAKEFILE_PATH}")
          echo "Local PKG_UPSTREAM_VERSION: ${CUR_UPSTREAM_VER}"
          changed="false"
          if [[ "${CUR_UPSTREAM_VER}" != "${PKG_UPSTREAM_VERSION}" ]]; then
            changed="true"
            echo "==> New -reF1nd version detected, download source tarball for hash calculation"
            TMP_ARCHIVE=$(mktemp --suffix=.tar.gz)
            curl -fL --retry 3 "https://codeload.github.com/${UPSTREAM_REPO}/tar.gz/${UPSTREAM_TAG}" -o "${TMP_ARCHIVE}"
            tar -tzf "${TMP_ARCHIVE}" >/dev/null
            PKG_HASH=$(sha256sum "${TMP_ARCHIVE}" | awk '{print $1}')
            rm -f "${TMP_ARCHIVE}"
            echo "PKG_HASH: ${PKG_HASH}"
            sed -i.bak \
              -e "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=${PKG_UPSTREAM_VERSION}/" \
              -e "s/^PKG_VERSION:=.*/PKG_VERSION:=${PKG_VERSION}/" \
              -e 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' \
              -e "s/^PKG_HASH:=.*/PKG_HASH:=${PKG_HASH}/" \
              "${MAKEFILE_PATH}"
            rm -f "${MAKEFILE_PATH}.bak"
            echo -e "\n==== Updated Makefile snippet ===="
            grep -E '^PKG_UPSTREAM_VERSION|^PKG_VERSION|^PKG_RELEASE|^PKG_HASH' "${MAKEFILE_PATH}"
          fi
          {
            echo "changed=${changed}"
            echo "tag=${UPSTREAM_TAG}"
            echo "pkg_upstream_version=${PKG_UPSTREAM_VERSION}"
            echo "pkg_version=${PKG_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit & Push update (only when changed=true)
        if: steps.upstream_check.outputs.changed == 'true'
        run: |
          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"
          git add mi_patch/sing-box-Makefile
          git diff --cached --exit-code || {
            git commit -m "chore: update sing‑box‑reF1nd to ${{ steps.upstream_check.outputs.pkg_upstream_version }}"
            git push origin "${GITHUB_REF_NAME}"
          }
